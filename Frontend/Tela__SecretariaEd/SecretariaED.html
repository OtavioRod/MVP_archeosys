<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArckeoSys | Secretaria de Educação</title>
    <link rel="stylesheet" href="SecretariaED.css">
</head>
<body>
    <header class="topo">
        <div class="cabecalho">
            <h1>ArckeoSys</h1>
            <p>Secretaria de Educação</p>
        </div>
    </header>

    <main>
        <!--navegação btn-->
        <div class="acoes-rapidas">
            <button type="button" class="btn-nav" id="btnMostrarEscola">Cadastrar Escola</button>
            <button type="button" class="btn-nav" id="btnMostrarDiretor">Cadastrar Diretor</button>
            <button type="button" class="btn-nav" id="btnAtualizarLista">Atualizar Lista</button>
            <button type="button" class="btn-nav" id="btnListarTudo">Listar Tudo</button>
        </div>

        <!--cadastro de escolas--> 
        <section class="card form-section" id="cardEscola" style="display:none;">
            <div class="titulo-card">
                <h2>Cadastrar Escola</h2>
            </div>
            <form id="formEscola" class="form-grid">
                <input type="text" id="nomeEscola" placeholder="Nome da Escola" required>
                <input type="text" id="enderecoEscola" placeholder="Endereço" required>
                <div class="acoes">
                    <button type="submit" class="btn-sucesso">Salvar Escola</button>
                    <button type="button" class="btn-excluir" id="fecharEscola">Fechar</button>
                </div>
            </form>
            <div class="resposta" id="respostaEscola"></div>
        </section>

        <!--cadastro diretor-->
        <section class="card form-section" id="cardDiretor" style="display:none;">
            <div class="titulo-card">
                <h2>Cadastrar Diretor</h2>
            </div>
            <form id="formDiretor" class="form-grid">
                <input type="text" id="nomeDiretor" placeholder="Nome do Diretor" required>
                <input type="email" id="emailDiretor" placeholder="Email" required>
                <input type="password" id="senhaDiretor" placeholder="Senha" required>
                
                <!-- Lista de Seleção Dinâmica para Vincular a Escola -->
                <select id="escolaDiretor" required>
                    <option value="" disabled selected>Selecione a Escola Vinculada</option>
                    <!-- As opções de escolas serão geradas dinamicamente via JS -->
                </select>

                <div class="acoes">
                    <button type="submit" class="btn-sucesso">Salvar Diretor</button>
                    <button type="button" class="btn-excluir" id="fecharDiretor">Fechar</button>
                </div>
            </form>
            <div class="resposta" id="respostaDiretor"></div>
        </section>

        <!--tabela-->
        <section class="card user-management-section">
            <div class="titulo-card">
                <h2>Escolas e Diretores</h2>
            </div>
            <div class="table-container">
                <table id="tabela">
                    <thead>
                        <tr>
                            <th>Escola</th>
                            <th>Endereço</th>
                            <th>Diretor(a)</th>
                            <th>Email do Diretor(a)</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- as linhas serão inseridas pelo js - dados -->
                    </tbody>
                </table>
            </div>
        </section>

        <!--editar-->
        <dialog id="modalEditar">
            <form id="formEditar" method="dialog" class="modal-form">
                <h3>Editar Registro</h3>
                <input type="hidden" id="editId">
                
                <label>Escola:</label>
                <input id="editEscola" type="text" required>
                
                <label>Endereço:</label>
                <input id="editEndereco" type="text" required>
                
                <label>Diretor:</label>
                <input id="editDiretor" type="text">
                
                <label>Email:</label>
                <input id="editEmail" type="email">
                
                <div class="modal-actions">
                    <button type="submit" class="btn-principal">Salvar</button>
                    <button type="button" class="btn-excluir" id="fecharEditar">Cancelar</button>
                </div>
            </form>
        </dialog>

        <!--excluir-->
        <dialog id="modalExcluir">
            <h3>Excluir Informações</h3>
            <p>Escolha o que deseja remover do registro.</p>
            <div class="modal-form" style="margin-top: 15px;">
                <div class="form-grid">
                    <button id="btnExcluirEscola" class="btn-excluir">Excluir Escola Completa</button>
                    <button id="btnExcluirEndereco" class="btn-nav">Limpar Endereço</button>
                    <button id="btnExcluirDiretor" class="btn-nav">Remover Diretor</button>
                    <button id="btnExcluirEmail" class="btn-nav">Remover Email</button>
                </div>
                <div class="modal-actions">
                    <button id="fecharExcluir" class="btn-principal">Cancelar</button>
                </div>
            </div>
        </dialog>
    </main>

    <script src="SecretariaED.js"></script>
</body>
</html>
